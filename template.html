<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/* ── 색 토큰 ─────────────────────────────────────────────
   dataviz 기본 팔레트. 계열색은 회사(엔티티)에 고정 배정되며
   범례를 껐다 켜도 바뀌지 않는다. */
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --good: #006300;
  --bad: #d03b3b;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --good: #0ca30c;
    --bad: #e66767;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --page: #0d0d0d;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --good: #0ca30c;
  --bad: #e66767;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  font-size: 14px;
  line-height: 1.55;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 64px; }

/* ── 머리말 ── */
header { margin-bottom: 28px; }
h1 { font-size: 26px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
.sub { color: var(--text-secondary); font-size: 13.5px; margin: 0; }
.sub b { font-weight: 600; color: var(--text-primary); }

/* ── KPI 타일 ── */
.kpis {
  display: grid; gap: 12px; margin: 24px 0 8px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.kpi {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px 12px;
}
.kpi .k-label { color: var(--text-secondary); font-size: 12.5px; }
.kpi .k-value { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px; }
.kpi .k-unit { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-left: 2px; }
.kpi .k-delta { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; }
.kpi .up { color: var(--good); font-weight: 600; }
.kpi .down { color: var(--bad); font-weight: 600; }

/* ── 필터 행 (차트 전체에 적용) ── */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  margin: 22px 0 14px; padding: 10px 14px;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
}
.controls .grp { display: flex; align-items: center; gap: 8px; }
.controls .grp-label { color: var(--text-secondary); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 12.5px; padding: 4px 11px; border: 0; cursor: pointer;
  background: transparent; color: var(--text-secondary);
}
.seg button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); font-weight: 600; }

/* ── 범례 (전역, 클릭하면 계열 표시/숨김) ── */
.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.legend button {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: 12.5px; cursor: pointer;
  background: transparent; color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px 3px 8px;
}
.legend button .swatch { width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
.legend button[aria-pressed="false"] { opacity: 0.4; text-decoration: line-through; }
.legend button .nm { color: var(--text-primary); }
.legend button.target .nm { font-weight: 650; }

/* ── 차트 그리드 ── */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px 10px; position: relative;
}
.card h2 { font-size: 14.5px; font-weight: 600; margin: 0; }
.card .unit { color: var(--text-muted); font-size: 12px; margin: 1px 0 4px; }
.card svg { display: block; width: 100%; overflow: visible; }
.section-title { font-size: 17px; font-weight: 620; margin: 34px 0 12px; }

/* ── 차트 안 요소 ── */
.gridline { stroke: var(--grid); stroke-width: 1; }
.axisline { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.endlabel { font-size: 11.5px; font-weight: 500; }
.barvalue { fill: var(--text-secondary); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.barname { fill: var(--text-primary); font-size: 12px; }
.crosshair { stroke: var(--axis); stroke-width: 1; }
.hit { fill: transparent; }

/* ── 툴팁 ── */
.tip {
  position: absolute; z-index: 20; pointer-events: none; opacity: 0;
  transition: opacity .1s; min-width: 150px;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
}
.tip .t-head { color: var(--text-secondary); font-size: 11.5px; margin-bottom: 4px; }
.tip .t-row { display: flex; align-items: center; gap: 7px; justify-content: space-between; }
.tip .t-row .l { display: flex; align-items: center; gap: 6px; }
.tip .t-row .sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.tip .t-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip .t-row.dim { opacity: .55; }

/* ── 표 ── */
.tablewrap { overflow-x: auto; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 10px; padding: 4px 2px 2px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); }
thead th { color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--axis); }
tbody td { font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid); }
tbody tr.co-head td {
  font-weight: 650; background: var(--page); border-bottom: 1px solid var(--axis);
  text-align: left; padding-top: 9px;
}
tbody tr.co-head td .cdot { display: inline-block; width: 9px; height: 9px;
  border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
tbody tr.co-head td .origin { font-weight: 400; color: var(--text-muted);
  font-size: 11.5px; margin-left: 8px; }
td.neg { color: var(--bad); }
td.na { color: var(--text-muted); }
/* ── 산정내역 표 — 분류 머리 / 계정과목 / 합계 ── */
tbody tr.grp td { color: var(--text-secondary); font-weight: 600; font-size: 12px;
  padding-top: 8px; border-bottom: 0; }
tbody td.acct { padding-left: 26px; color: var(--text-secondary); font-weight: 400; }
tbody tr.sub td { font-weight: 600; border-bottom: 1px solid var(--axis); }
tbody tr.sub.net td { background: var(--page); }
tbody tr.sub td .origin { font-weight: 400; color: var(--text-muted);
  font-size: 11.5px; margin-left: 8px; }
/* 사용자가 주석을 보고 직접 넣은 값 표시 */
td .manual { color: var(--text-muted); font-size: 10px; margin-left: 3px; vertical-align: 2px; }

/* ── 각주 ── */
footer { margin-top: 30px; color: var(--text-secondary); font-size: 12.5px; }
footer ul { margin: 6px 0 0; padding-left: 18px; }
footer li { margin-bottom: 3px; }
footer .src { color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="doc-title"></h1>
    <p class="sub" id="doc-sub"></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <div class="grp">
      <span class="grp-label">금액 표시</span>
      <span class="seg" id="mode-seg">
        <button data-mode="abs" aria-pressed="true">실액</button>
        <button data-mode="index" aria-pressed="false">지수(기준연도=100)</button>
      </span>
    </div>
    <div class="grp" style="flex:1 1 320px">
      <span class="grp-label">회사</span>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="grid" id="charts"></div>

  <h2 class="section-title">최근 사업연도 순위</h2>
  <div class="grid" id="bars"></div>

  <h2 class="section-title">재무수치 표 <span style="font-weight:400;color:var(--text-muted);font-size:13px">(단위: 억원, 비율 %)</span></h2>
  <div class="tablewrap" id="table"></div>

  <h2 class="section-title">이자부부채·현금성자산 산정내역 <span style="font-weight:400;color:var(--text-muted);font-size:13px">(계정과목별, 단위: 억원)</span></h2>
  <div class="tablewrap" id="detail"></div>

  <footer>
    <div><b>출처 및 작성기준</b></div>
    <ul id="notes"></ul>
  </footer>
</div>

<div class="tip" id="tip"></div>

<script id="payload" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("payload").textContent);
const YEARS = DATA.years;
const COMPANIES = DATA.companies;
const tipEl = document.getElementById("tip");

/* 계열색은 회사에 고정 배정한다(순위·필터로 바뀌지 않는다). */
const colorOf = c => `var(--series-${c.slot})`;
const hidden = new Set();
let amountMode = "abs";   // abs | index

/* ── 숫자 포맷 ─────────────────────────────────────────── */
/* 표시 단위는 기준통화에 따라 파이썬이 정해서 넘겨준다
   (원화면 억원/조원, 달러면 백만달러/십억달러) */
const UNIT_SMALL = DATA.units.small;
const UNIT_LARGE = DATA.units.large;
const UNIT_RATIO = { div: 1, name: "%", dp: 1 };
const UNIT_MULT = { div: 1, name: "배", dp: 1 };

function unitFor(values) {
  const max = Math.max(0, ...values.filter(v => v !== null).map(v => Math.abs(v)));
  return max >= UNIT_LARGE.div ? UNIT_LARGE : UNIT_SMALL;
}
function fmt(v, dp) {
  if (v === null || v === undefined || !isFinite(v)) return "–";
  return v.toLocaleString("ko-KR", { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
function fmtValue(v, spec, unit) {
  if (v === null || v === undefined) return "–";
  if (spec.kind === "ratio") return fmt(v, 1) + "%";
  if (spec.kind === "multiple") return fmt(v, 1) + "배";
  if (amountMode === "index") return fmt(v, 1);
  return fmt(v / unit.div, unit.dp) + unit.name;
}

/* 지수화: 각 회사의 첫 유효연도를 100으로 환산.
   규모가 크게 다른 회사의 '추세'를 한 축에서 비교하기 위한 것으로,
   이중축(서로 다른 두 y축)을 쓰지 않기 위한 대안이다. */
function seriesValues(company, spec) {
  const raw = company.series[spec.key] || [];
  if (spec.kind !== "amount" || amountMode === "abs") return raw;
  const base = raw.find(v => v !== null && v !== 0);
  if (base === undefined) return raw.map(() => null);
  return raw.map(v => (v === null ? null : (v / Math.abs(base)) * 100));
}

/* ── 축 눈금 ───────────────────────────────────────────── */
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return ticks;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function showTip(html, x, y) {
  tipEl.innerHTML = html;
  tipEl.style.opacity = "1";
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = x + 14, top = y - h - 10;
  if (left + w > window.innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 16;
  tipEl.style.left = (left + window.scrollX) + "px";
  tipEl.style.top = (top + window.scrollY) + "px";
}
const hideTip = () => { tipEl.style.opacity = "0"; };

/* ── 라인 차트 ─────────────────────────────────────────── */
function drawLine(card, spec) {
  const svg = card.querySelector("svg");
  svg.textContent = "";

  const W = Math.max(360, card.clientWidth - 32);
  const H = 250;
  const M = { t: 14, r: 108, b: 26, l: 58 };   // r: 끝점 직접라벨 자리(영문 회사명 대비)
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);

  const shown = COMPANIES.filter(c => !hidden.has(c.name));
  const all = [];
  shown.forEach(c => seriesValues(c, spec).forEach(v => { if (v !== null) all.push(v); }));

  let unit = UNIT_RATIO;
  if (spec.kind === "multiple") unit = UNIT_MULT;
  else if (spec.kind === "amount") unit = amountMode === "abs" ? unitFor(all) : UNIT_MULT;

  card.querySelector(".unit").textContent =
    spec.kind === "ratio" ? "단위: %"
    : spec.kind === "multiple" ? "단위: 배 (시가총액은 기준일 하나, 실적은 각 사업연도)"
    : amountMode === "index" ? `지수 (${YEARS[0]}년 또는 최초 공시연도 = 100)`
    : "단위: " + unit.name;

  if (!all.length) {
    svg.appendChild(svgEl("text", { x: W / 2, y: H / 2, "text-anchor": "middle", class: "tick" }))
       .textContent = "표시할 자료가 없습니다";
    return;
  }

  /* 0을 항상 포함해 기준선이 눈에 보이게 한다.
     다만 데이터가 모두 양수면 축을 0 아래로 내리지 않는다
     (부채비율에 -100 같은 있을 수 없는 눈금이 생기는 것을 막는다) */
  const dataMin = Math.min(...all), dataMax = Math.max(...all);
  let lo = Math.min(0, dataMin), hi = Math.max(0, dataMax);
  const pad = (hi - lo) * 0.08 || 1;
  const ticks = niceTicks(
    dataMin >= 0 ? 0 : lo - pad * 0.4,
    dataMax <= 0 ? 0 : hi + pad, 4);
  lo = ticks[0]; hi = ticks[ticks.length - 1];

  const px = i => M.l + (W - M.l - M.r) * (YEARS.length === 1 ? 0.5 : i / (YEARS.length - 1));
  const py = v => M.t + (H - M.t - M.b) * (1 - (v - lo) / (hi - lo));

  ticks.forEach(t => {
    svg.appendChild(svgEl("line", { class: t === 0 ? "axisline" : "gridline",
      x1: M.l, x2: W - M.r, y1: py(t), y2: py(t) }));
    const label = svgEl("text", { class: "tick", x: M.l - 8, y: py(t) + 3.5, "text-anchor": "end" });
    if (spec.kind === "ratio" || spec.kind === "multiple" || amountMode === "index") {
      label.textContent = fmt(t, Math.abs(t) < 10 && t % 1 !== 0 ? 1 : 0);
    } else {
      /* 400.0조 처럼 큰 눈금에 붙는 소수점은 읽는 데 방해만 된다. 0도 마찬가지. */
      const scaled = t / unit.div;
      label.textContent = fmt(scaled, (scaled === 0 || Math.abs(scaled) >= 100) ? 0 : unit.dp);
    }
    svg.appendChild(label);
  });

  YEARS.forEach((y, i) => {
    const label = svgEl("text", { class: "tick", x: px(i), y: H - 8, "text-anchor": "middle" });
    label.textContent = y;
    svg.appendChild(label);
  });

  const ends = [];
  shown.forEach(c => {
    const vals = seriesValues(c, spec);
    const pts = [];
    vals.forEach((v, i) => { if (v !== null) pts.push([px(i), py(v), i]); });
    if (!pts.length) return;

    const color = colorOf(c);
    /* 대상회사는 굵게 — 색이 아니라 굵기로 주인공을 표시한다 */
    const width = c.is_target ? 3 : 2;
    svg.appendChild(svgEl("path", {
      d: pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" "),
      fill: "none", stroke: color, "stroke-width": width,
      "stroke-linecap": "round", "stroke-linejoin": "round",
    }));
    pts.forEach(p => {
      /* 겹치는 마커끼리 붙어 보이지 않도록 표면색 2px 링을 두른다 */
      svg.appendChild(svgEl("circle", { cx: p[0], cy: p[1], r: 4,
        fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }));
    });
    const last = pts[pts.length - 1];
    ends.push({ name: c.name, y: last[1], x: last[0], color, target: c.is_target });
  });

  /* 끝점 직접라벨 — 겹치면 위아래로 밀어낸다 */
  ends.sort((a, b) => a.y - b.y);
  const GAP = 13;
  for (let i = 1; i < ends.length; i++) {
    if (ends[i].y - ends[i - 1].y < GAP) ends[i].y = ends[i - 1].y + GAP;
  }
  const overflow = ends.length ? ends[ends.length - 1].y - (H - M.b - 2) : 0;
  if (overflow > 0) ends.forEach(e => { e.y -= overflow; });

  ends.forEach(e => {
    const label = svgEl("text", { class: "endlabel", x: W - M.r + 8, y: e.y + 4,
      fill: e.color, "font-weight": e.target ? 700 : 500 });
    label.textContent = e.name.length > 12 ? e.name.slice(0, 11) + "…" : e.name;
    svg.appendChild(label);
  });

  /* 크로스헤어 + 툴팁 */
  const cross = svgEl("line", { class: "crosshair", y1: M.t, y2: H - M.b, opacity: 0 });
  svg.appendChild(cross);
  const dots = svgEl("g", { opacity: 0 });
  svg.appendChild(dots);

  const hit = svgEl("rect", { class: "hit", x: 0, y: 0, width: W, height: H });
  svg.appendChild(hit);

  hit.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const mx = (ev.clientX - box.left) * (W / box.width);
    let idx = 0, best = Infinity;
    YEARS.forEach((_, i) => { const d = Math.abs(px(i) - mx); if (d < best) { best = d; idx = i; } });

    cross.setAttribute("x1", px(idx)); cross.setAttribute("x2", px(idx));
    cross.setAttribute("opacity", 1);
    dots.textContent = ""; dots.setAttribute("opacity", 1);

    let rows = "";
    shown.forEach(c => {
      const v = seriesValues(c, spec)[idx];
      const color = colorOf(c);
      if (v !== null) {
        dots.appendChild(svgEl("circle", { cx: px(idx), cy: py(v), r: 5.5,
          fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }));
      }
      rows += `<div class="t-row${v === null ? " dim" : ""}"><span class="l">`
        + `<span class="sw" style="background:${color}"></span>${c.name}</span>`
        + `<span class="v">${fmtValue(v, spec, unit)}</span></div>`;
    });
    showTip(`<div class="t-head">${YEARS[idx]}년 · ${spec.label}</div>${rows}`, ev.clientX, ev.clientY);
  });
  hit.addEventListener("mouseleave", () => {
    hideTip(); cross.setAttribute("opacity", 0); dots.setAttribute("opacity", 0);
  });
}

/* ── 가로 막대 (최근 사업연도 순위) ────────────────────── */
function drawBar(card, spec) {
  const svg = card.querySelector("svg");
  svg.textContent = "";

  const shown = COMPANIES.filter(c => !hidden.has(c.name));
  const year = DATA.latest_year;
  const yi = YEARS.indexOf(year);

  const rows = shown.map(c => ({
    name: c.name, color: colorOf(c), target: c.is_target,
    v: (c.series[spec.key] || [])[yi],
  })).filter(r => r.v !== null && r.v !== undefined)
     .sort((a, b) => b.v - a.v);

  const unit = spec.kind === "amount" ? unitFor(rows.map(r => r.v))
    : (spec.kind === "multiple" ? UNIT_MULT : UNIT_RATIO);
  card.querySelector(".unit").textContent = `${year}년 기준 · 단위: ${unit.name}`;

  const W = Math.max(360, card.clientWidth - 32);
  const rowH = 30;
  const H = Math.max(60, rows.length * rowH + 12);
  /* 왼쪽은 회사명 자리 — 영문 회사명(NVIDIA CORP)이 들어가므로 넉넉히 잡는다 */
  const M = { t: 6, r: 74, b: 6, l: 122 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);

  if (!rows.length) return;
  const lo = Math.min(0, ...rows.map(r => r.v));
  const hi = Math.max(0, ...rows.map(r => r.v));
  const span = (hi - lo) || 1;
  const x0 = M.l + (W - M.l - M.r) * (0 - lo) / span;
  const bx = v => M.l + (W - M.l - M.r) * (v - lo) / span;

  svg.appendChild(svgEl("line", { class: "axisline", x1: x0, x2: x0, y1: M.t, y2: H - M.b }));

  rows.forEach((r, i) => {
    /* 인접 막대 사이 2px 간격(테두리 대신 여백으로 분리) */
    const y = M.t + i * rowH + 4;
    const h = rowH - 10;
    const x = Math.min(x0, bx(r.v));
    const w = Math.max(1.5, Math.abs(bx(r.v) - x0));

    const bar = svgEl("rect", { x, y, width: w, height: h, fill: r.color, rx: 4, ry: 4 });
    svg.appendChild(bar);
    /* 기준선(0) 쪽 모서리는 각지게 — 데이터 끝만 둥글다 */
    const flat = svgEl("rect", {
      x: r.v >= 0 ? x0 : x0 - 4, y, width: 4, height: h, fill: r.color,
    });
    svg.appendChild(flat);

    const nm = svgEl("text", { class: "barname", x: M.l - 10, y: y + h / 2 + 4,
      "text-anchor": "end", "font-weight": r.target ? 700 : 400 });
    nm.textContent = r.name.length > 13 ? r.name.slice(0, 12) + "…" : r.name;
    svg.appendChild(nm);

    const val = svgEl("text", { class: "barvalue",
      x: r.v >= 0 ? bx(r.v) + 7 : bx(r.v) - 7, y: y + h / 2 + 4,
      "text-anchor": r.v >= 0 ? "start" : "end" });
    val.textContent = spec.kind === "amount"
      ? fmt(r.v / unit.div, unit.dp) : fmt(r.v, 1) + unit.name;
    svg.appendChild(val);

    const hit = svgEl("rect", { class: "hit", x: 0, y: M.t + i * rowH, width: W, height: rowH });
    svg.appendChild(hit);
    hit.addEventListener("mousemove", ev => {
      const shown = spec.kind === "amount"
        ? fmt(r.v / UNIT_SMALL.div, UNIT_SMALL.dp) + UNIT_SMALL.name
        : fmt(r.v, 1) + unit.name;
      showTip(`<div class="t-head">${year}년 · ${spec.label}</div>`
        + `<div class="t-row"><span class="l"><span class="sw" style="background:${r.color}"></span>`
        + `${r.name}</span><span class="v">${shown}</span></div>`,
        ev.clientX, ev.clientY);
    });
    hit.addEventListener("mouseleave", hideTip);
  });
}

/* ── 조립 ──────────────────────────────────────────────── */
function makeCard(container, spec, drawer) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${spec.label}</h2><div class="unit"></div><svg></svg>`;
  container.appendChild(card);
  card._spec = spec; card._draw = drawer;
  return card;
}

const cards = [];
DATA.line_charts.forEach(spec => cards.push(makeCard(document.getElementById("charts"), spec, drawLine)));
DATA.bar_charts.forEach(spec => cards.push(makeCard(document.getElementById("bars"), spec, drawBar)));
const redraw = () => cards.forEach(c => c._draw(c, c._spec));

/* 범례 — 색은 회사에 고정, 끄고 켜도 다른 회사 색이 바뀌지 않는다 */
const legend = document.getElementById("legend");
COMPANIES.forEach(c => {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-pressed", "true");
  if (c.is_target) b.className = "target";
  b.innerHTML = `<span class="swatch" style="color:${colorOf(c)}"></span>`
    + `<span class="nm">${c.name}${c.is_target ? " (대상)" : ""}</span>`;
  b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", on ? "false" : "true");
    if (on) hidden.add(c.name); else hidden.delete(c.name);
    redraw();
  });
  legend.appendChild(b);
});

document.querySelectorAll("#mode-seg button").forEach(b => {
  b.addEventListener("click", () => {
    amountMode = b.dataset.mode;
    document.querySelectorAll("#mode-seg button").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    redraw();
  });
});

/* 머리말·KPI·표·각주는 파이썬이 만든 HTML을 그대로 꽂는다 */
document.getElementById("doc-title").textContent = DATA.title;
document.getElementById("doc-sub").innerHTML = DATA.subtitle;
document.getElementById("kpis").innerHTML = DATA.kpi_html;
document.getElementById("table").innerHTML = DATA.table_html;
document.getElementById("detail").innerHTML = DATA.detail_html || "";
document.getElementById("notes").innerHTML = DATA.notes_html;

redraw();
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(redraw, 120);
});
</script>
